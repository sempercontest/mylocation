<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #00416f;
  --color-accent-blue: #002c4a;
  --color-accent-orange: #f58c26;
  --color-text-dark: #001625;
  --color-text-muted: #6b7280;
  --surface: #ffffff;
  --surface-inverse: #0b2a45;
  --color-border-light: #d7dddf;
  --status-danger: #a52834;
  --status-danger-bg: #fdecea;
  --status-success: #16a34a;
  --radius-md: 6px; --radius-lg: 8px;
  --font-sans: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--color-text-dark);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* Full-height app: topbar is fixed-size, everything else flexes to fill
   whatever height is left — this is what maximizes the textarea. */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh; /* falls back to 100vh below for older browsers */
  height: 100vh;
}

.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 10px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: var(--surface-inverse);
  color: #fff;
}
.topbar__title { font-size: 15px; font-weight: 700; flex: none; padding: 0 2px; white-space: nowrap; }
.topbar__select {
  flex: 1; min-width: 0;
  height: 40px;
  padding: 0 10px;
  font: 500 14px/1.4 var(--font-sans);
  color: #fff;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--radius-md);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.topbar__select option { color: var(--color-text-dark); }
.topbar__add {
  flex: none;
  width: 40px; height: 40px;
  font-size: 20px; font-weight: 600; line-height: 1;
  color: #fff;
  background: var(--color-accent-orange);
  border: 0;
  border-radius: var(--radius-md);
  cursor: pointer;
}
.topbar__add:active { transform: translateY(1px); }

.accent-bar { flex: none; height: 3px; background: linear-gradient(90deg, var(--color-primary) 0%, #005794 62%, var(--color-accent-orange) 100%); }

#errorBanner {
  display: none; flex: none;
  padding: 8px 12px; font-size: 12px;
  background: var(--status-danger-bg); color: var(--status-danger);
  border-bottom: 1px solid #fda29b;
}

.content {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 8px;
}
.content__meta {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--color-text-muted);
}
.name-input {
  flex: 1; min-width: 0;
  height: 40px;
  padding: 0 12px;
  font: 500 15px/1.4 var(--font-sans);
  color: var(--color-text-dark);
  background: var(--surface);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  outline: none;
}
.name-input:focus { border-color: var(--color-primary); }

/* The star of the show: fills all remaining vertical space. */
.textarea-dark {
  flex: 1;
  width: 100%;
  min-height: 0;
  padding: 14px 14px;
  font: 400 15px/1.6 var(--font-sans);
  color: #e7e9ea;
  background: #2b2e33;
  border: 1px solid #45494f;
  border-radius: var(--radius-lg);
  outline: none;
  resize: none;
  -webkit-appearance: none;
}
.textarea-dark::placeholder { color: #8a8f96; }
.textarea-dark:focus { border-color: var(--color-accent-orange); }

.content__footer { flex: none; display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 46px; padding: 0 16px;
  font: 600 15px/1 var(--font-sans);
  border: 0; border-radius: var(--radius-lg);
  cursor: pointer; white-space: nowrap;
}
.btn--primary { flex: 1; background: var(--color-primary); color: #fff; }
.btn--primary:active { background: var(--color-accent-blue); }
.btn--outline { background: var(--surface); color: var(--color-text-dark); border: 1px solid var(--color-border-light); }

.status { flex: none; padding: 4px 2px 0; font-size: 12px; text-align: center; color: var(--color-text-muted); min-height: 18px; }
.status--err { color: var(--status-danger); }
.status--ok { color: var(--status-success); }

.empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; font-size: 14px; text-align: center; color: var(--color-text-muted); }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar__title">📒</div>
    <select class="topbar__select" id="noteSelect">
      <option value="">Loading notes...</option>
    </select>
    <button class="topbar__add" id="addBtn" title="Add new note">+</button>
  </div>
  <div class="accent-bar"></div>
  <div id="errorBanner"></div>

  <div class="content" id="content">
    <div class="empty">Loading...</div>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
  // Your deployed Apps Script web app URL. If you redeploy as a NEW
  // deployment (not "manage deployments > new version"), update this.
  var BASE_URL = 'https://script.google.com/macros/s/AKfycbzP_Ns5-KbixJj120rtKaMocV3rZ8vy6YDK5nYW0QnM63dQz2qvpQ0mKMYre73sAA0/exec';

  var ROWS = [];
  var selectedSeq = null;
  var isAdding = false;

  var selectEl = document.getElementById('noteSelect');
  var addBtn = document.getElementById('addBtn');
  var contentEl = document.getElementById('content');
  var statusEl = document.getElementById('status');
  var errorBannerEl = document.getElementById('errorBanner');

  function showBanner(msg) {
    console.error(msg);
    errorBannerEl.textContent = msg;
    errorBannerEl.style.display = 'block';
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' status--err' : ' status--ok');
    setTimeout(function () { statusEl.textContent = ''; }, 2500);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function sortRows(rows) {
    return rows.slice().sort(function (a, b) {
      return new Date(b.dateAndTime) - new Date(a.dateAndTime);
    });
  }

  function renderSelect() {
    ROWS = sortRows(ROWS);
    selectEl.innerHTML = '';
    if (ROWS.length === 0) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'No notes yet';
      selectEl.appendChild(opt);
      return;
    }
    ROWS.forEach(function (row) {
      var opt = document.createElement('option');
      opt.value = row.seqNum;
      opt.textContent = (row.name || 'Untitled') + '  ·  ' + (row.dateDisplay || '');
      selectEl.appendChild(opt);
    });
    if (selectedSeq != null) selectEl.value = selectedSeq;
  }

  function loadRows(selectAfter) {
    fetch(BASE_URL + '?action=list')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) { showBanner('Could not load notes: ' + data.error); return; }
        ROWS = data.rows;
        renderSelect();
        if (selectAfter != null) {
          selectNote(selectAfter);
        } else if (ROWS.length > 0) {
          selectNote(sortRows(ROWS)[0].seqNum);
        } else {
          showEmpty();
        }
      })
      .catch(function (err) { showBanner('Could not reach the Apps Script backend: ' + err); });
  }

  function showEmpty() {
    isAdding = false;
    selectedSeq = null;
    contentEl.innerHTML = '<div class="empty">No notes yet — tap + to add one.</div>';
  }

  function selectNote(seqNum) {
    isAdding = false;
    selectedSeq = seqNum;
    var row = ROWS.find(function (r) { return String(r.seqNum) === String(seqNum); });
    if (!row) return;
    selectEl.value = seqNum;

    contentEl.innerHTML =
      '<div class="content__meta">' + escapeHtml(row.dateDisplay || '') + '</div>' +
      '<textarea class="textarea-dark" id="notesField" placeholder="Write your notes here...">' + escapeHtml(row.notes || '') + '</textarea>' +
      '<div class="content__footer"><button class="btn btn--primary" id="saveBtn">Save changes</button></div>';

    document.getElementById('saveBtn').addEventListener('click', function () {
      var notes = document.getElementById('notesField').value;
      saveUpdate(row.seqNum, notes);
    });
  }

  function showAddForm() {
    isAdding = true;
    selectedSeq = null;
    selectEl.value = '';

    contentEl.innerHTML =
      '<div class="content__meta"><input class="name-input" id="nameField" type="text" placeholder="Name"></div>' +
      '<textarea class="textarea-dark" id="notesField" placeholder="Write your notes here..."></textarea>' +
      '<div class="content__footer">' +
        '<button class="btn btn--outline" id="cancelBtn">Cancel</button>' +
        '<button class="btn btn--primary" id="saveNewBtn">Save note</button>' +
      '</div>';

    document.getElementById('nameField').focus();
    document.getElementById('cancelBtn').addEventListener('click', function () {
      if (ROWS.length > 0) selectNote(sortRows(ROWS)[0].seqNum); else showEmpty();
    });
    document.getElementById('saveNewBtn').addEventListener('click', function () {
      var name = document.getElementById('nameField').value.trim();
      var notes = document.getElementById('notesField').value;
      if (!name) { setStatus('Please enter a name.', true); return; }
      saveNew(name, notes);
    });
  }

  function saveNew(name, notes) {
    setStatus('Saving...', false);
    fetch(BASE_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'add', name: name, notes: notes })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) { showBanner('Save failed: ' + data.error); return; }
        ROWS = data.rows;
        setStatus('Note added.', false);
        var newest = sortRows(ROWS)[0];
        renderSelect();
        if (newest) selectNote(newest.seqNum); else showEmpty();
      })
      .catch(function (err) { showBanner('Save request failed: ' + err); });
  }

  function saveUpdate(seqNum, notes) {
    setStatus('Saving...', false);
    fetch(BASE_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', seqNum: seqNum, notes: notes })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) { showBanner('Save failed: ' + data.error); return; }
        ROWS = data.rows;
        renderSelect();
        setStatus('Saved.', false);
      })
      .catch(function (err) { showBanner('Save request failed: ' + err); });
  }

  selectEl.addEventListener('change', function () {
    if (selectEl.value) selectNote(selectEl.value);
  });
  addBtn.addEventListener('click', showAddForm);

  loadRows();
</script>
</body>
</html>
